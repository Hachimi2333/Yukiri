<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Yukiri</title>
  <desc id="desc">A sixfold geometric snow crystal with an open hexagonal center.</desc>
