    <use href="#crystal" transform="rotate(120 64 64)"/>
    <use href="#crystal" transform="rotate(180 64 64)"/>
    <use href="#crystal" transform="rotate(240 64 64)"/>
    <use href="#crystal" transform="rotate(300 64 64)"/>
  </g>
</svg>
