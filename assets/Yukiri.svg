    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75DDF1"/>
      <stop offset="1" stop-color="#278ED6"/>
    </linearGradient>
    <path id="crystal" d="M64 12 L72 28 L82 26 L78 38 L72 41 L69 51 L64 55 L59 51 L56 41 L50 38 L46 26 L56 28 Z"/>
  </defs>
  <g fill="url(#ice)">
